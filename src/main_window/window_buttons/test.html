<!DOCTYPE html>
<html lang="en">

<head>
    <title>Test</title>

</head>

<body>
    <p id="abc">Hello world!</p>
    <p>Goodbye!</p>
    <span id="def">Hello again!</span>
    <p class="selected">Different class</p>
    <p>No class</p>
    <p class="selected">Different class</p>
    <p>No class</p>
    <p class="selected">Different class</p>
    <div class="space"></div>

    <button id="button">Click me!</button>


</body>

<style>
    body {
        background-color: black;
    }

    #abc, #def {
        color: white;
    }

    p[class="selected"] {
        color: red;
    }

    #button {
        background-color: blue;
        color: white;
        transition-duration: 2s;
        height: 40px;
        width: 80px;
        position: relative;
        top: 50%;
        left: 50%;
    }

    #button:hover {
        background-color: aqua;
        width: 150px;
    }

    .space {
        height: 30px;
    }

</style>

</html>
