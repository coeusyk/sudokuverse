<!DOCTYPE html>
<html lang="en">
    <head>
        <title>sign up window</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container" >
            
            
            <div class="sign-up-form">
                <h1><p1 class="texth">Welcome to</p1><p2 class="texth1"> Sudoku</p2></h1>
                <p class="text">Register your account</p>
                <p class="text1">Username</p>
                <input type="text" class="input-box"  >
                <p class="text1">Date of Birth</p>
                <input type="date" class="input-box">
                <p class="text1">Email</p>
                <input type="email" class="input-box" >
                <p class="text1">Passward</p>
                <input type="password" class="input-box" >
                <button class="btn1" onclick="closepopup()">Create account</button>
                <p class="text1">Already have an account?<a href='#'>Log in</a></p>
            </div>
        </div>
    
        <script>
            let popup = document.getElementById("popup");
            function openpopup()
            {
                popup.classList.add("open-popup");
            }
            function closepopup()
            {
                popup.classList.add("close-popup");
            }
        </script>
    </body>
    
</html>
